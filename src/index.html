<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Bunnies và thế giới tri thức - Game giáo dục cho trẻ em">
    <title>Bunnies và thế giới tri thức</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#7c5cbf">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bunnies">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: #1a0f2e;
        }

        #game-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Loading screen — hiển thị bản đồ thế giới ngay từ frame đầu tiên */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #1a0f2e url('screens/menu/assets/backgrounds/bunnies_world.jpg') center / cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #loading span {
            color: #FFD700;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0 2px #000;
            background: rgba(59, 36, 86, 0.75);
            border: 2px solid rgba(255, 215, 0, 0.8);
            border-radius: 999px;
            padding: 12px 28px;
            animation: loadingPulse 1.2s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        #loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading"><span>🐰 Đang tải game...</span></div>
    <div id="game-container"></div>

    <!-- Phaser 3 Library (local — chạy offline hoàn toàn) -->
    <script src="lib/phaser.min.js"></script>
    
    <!-- Core Character Systems -->
    <script src="core/characters/bunny/BunnyCharacter.js"></script>
    <script src="core/characters/bunny/BunnyAnimationGenerator.js"></script>
    <script src="core/characters/bunny/BunnyBehaviorSystem.js"></script>
    
    <!-- Wise Owl Character -->
    <script src="core/characters/wise_owl/WiseOwlAnimationGenerator.js"></script>
    <script src="core/characters/wise_owl/WiseOwlCharacter.js"></script>

    <!-- Young Fox (Subtraction Hill, tái sử dụng được) -->
    <script src="core/characters/young_fox/YoungFoxCharacter.js"></script>
    <!-- Squirrel (Khu Rừng Định Hướng) -->
    <script src="core/characters/squirrel/SquirrelCharacter.js"></script>
    
    <!-- Butterfly System -->
    <script src="core/characters/butterfly/ButterflyGenerator.js"></script>
    <script src="core/characters/butterfly/ButterflyBehaviorSystem.js"></script>
    
    <!-- Ambient Creatures System -->
    <script src="core/characters/ambient_creatures/AmbientCreaturesGenerator.js"></script>
    <script src="core/characters/ambient_creatures/AmbientCreaturesBehavior.js"></script>
    <script src="core/characters/firefly/FireflyBehaviorSystem.js"></script>
    <script src="core/characters/bird/BirdBehaviorSystem.js"></script>
    <script src="core/characters/magic_particle/MagicParticleBehaviorSystem.js"></script>
    
    <!-- Shared UI helpers -->
    <script src="core/ui/IntroHelper.js"></script>
    <script src="core/effects/RewardFX.js"></script>

    <!-- Game Screens -->
    <script src="screens/boot/BootScreen.js"></script>
    <script src="screens/menu/world_map_data.js"></script>
    <script src="screens/menu/menu_screen.js"></script>
    <script src="screens/counting_forest/puzzle.js"></script>
    <script src="screens/ScreenLevelBackground.js"></script>
    <script src="screens/counting_forest/screen.js"></script>
    <script src="screens/mirror_city/puzzle.js"></script>
    <script src="screens/mirror_city/screen.js"></script>
    <script src="screens/subtraction_hill/puzzle.js"></script>
    <script src="screens/subtraction_hill/screen.js"></script>
    <script src="screens/orientation_forest/puzzle.js"></script>
    <script src="screens/orientation_forest/screen.js"></script>
    <script src="screens/UIScreen.js"></script>
    
    <!-- Game Flow Configuration -->
    <script src="GameFlowConfig.js"></script>
    
    <!-- Main Game Configuration -->
    <script src="game.js"></script>
    
    <!-- Đăng ký Service Worker → cài được như app, chơi offline -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').catch(function(err) {
                    console.warn('Service worker registration failed:', err);
                });
            });
        }
    </script>

    <!-- Error handling and loading screen -->
    <script>
        window.addEventListener('load', function() {
            // Hide loading div after a short delay
            setTimeout(function() {
                const loadingDiv = document.getElementById('loading');
                if (loadingDiv) {
                    loadingDiv.classList.add('hidden');
                }
            }, 500);
        });
        
        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('Game error:', e.error);
            const loadingDiv = document.getElementById('loading');
            if (loadingDiv) {
                loadingDiv.textContent = 'Lỗi: ' + (e.error ? e.error.message : 'Unknown error');
                loadingDiv.classList.remove('hidden');
                loadingDiv.style.color = '#ff0000';
            }
        });
    </script>
</body>
</html>
